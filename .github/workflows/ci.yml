name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:plugin
      - run: npm ci
        working-directory: example
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: example
      - run: npx eslint . --max-warnings 0
        working-directory: example
      - name: Check the tarball contents
        run: |
          rm -rf "$RUNNER_TEMP/pack" && mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          tar -tzf "$RUNNER_TEMP/pack"/*.tgz | sed 's|^package/||' | grep -v '/$' > tarball-files.txt
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const files = readFileSync("tarball-files.txt", "utf8").split("\n").filter(Boolean);
            const required = [
              "build/index.js",
              "build/index.d.ts",
              "app.plugin.js",
              "plugin/build/index.js",
              "expo-module.config.json",
              // Required by autolinking; consumers see "Cannot find native module ExpoGattServer" if missing.
              "ios/ExpoGattServer.podspec",
              "android/build.gradle",
              "ios/GattServerManager.swift",
              "android/src/main/java/expo/modules/gattserver/GattServerManager.kt",
            ];
            const missing = required.filter((f) => !files.includes(f));
            if (missing.length) throw new Error("missing from the tarball: " + missing.join(", "));
            const forbidden = files.filter(
              (f) =>
                f.startsWith("src/") ||
                f.startsWith("tests/") ||
                f.startsWith("ios/build/") ||
                f.startsWith("ios/Pods/") ||
                f.split("/").includes("__tests__") ||
                f === "Package.swift"
            );
            if (forbidden.length) throw new Error("should not ship: " + forbidden.join(", "));
            console.log(`tarball looks right (${files.length} files)`);
          '

  swift:
    name: Swift (iOS peripheral logic)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: npm run test:ios

  android:
    name: Kotlin (Android peripheral logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Verify the committed gradle-wrapper.jar is from Gradle's official release.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: npm run test:android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: tests/android/build/reports/tests/

  android-integration:
    name: Android module builds against Expo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform android --no-install
        working-directory: example
      - run: ./gradlew :expo-gatt-server:compileReleaseKotlin --console=plain
        working-directory: example/android

  ios-integration:
    name: iOS module builds against Expo
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # Xcode 26.5 required: ExpoModulesJSI Swift 6.2 type-checking fails on older versions; no fallback.
      - name: Select Xcode 26.5
        run: |
          candidate="/Applications/Xcode_26.5.app"
          if [ ! -d "$candidate" ]; then
            echo "Xcode 26.5 not found. Installed: $(ls -d /Applications/Xcode_*.app 2>/dev/null | tr '\n' ' ')" >&2
            exit 1
          fi
          sudo xcode-select -s "$candidate"
          echo "Selected $candidate"
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform ios --no-install
        working-directory: example
      - run: pod install
        working-directory: example/ios
      - name: Compile the ExpoGattServer pod target
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace "$(ls -d *.xcworkspace | head -1)" \
            -scheme ExpoGattServer \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            build CODE_SIGNING_ALLOWED=NO
