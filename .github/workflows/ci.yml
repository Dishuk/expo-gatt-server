name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The example is the only consumer-facing usage of the public API, and `expo prebuild` in the
      # integration jobs does not typecheck it — so until this ran, the app the guides point readers at
      # could break against the API it demonstrates and still ship green.
      - run: npm ci
        working-directory: example
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: example
      # Linted as well as type-checked, and for the same reason. `expo-module lint` hardcodes its target
      # to `src`, so `npm run lint` never reached the example — which meant the rules the package fails
      # its own build over were unenforced in the one place a reader is pointed at, and it had accumulated
      # real errors while CI stayed green.
      - run: npx eslint . --max-warnings 0
        working-directory: example
      # Both build outputs are published but not committed, so a break in either only ever surfaces at
      # `npm publish` otherwise.
      - run: npm run build
      - run: npm run build:plugin
      - name: Check the tarball contents
        run: |
          npm pack --dry-run --json > pack.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const files = JSON.parse(readFileSync("pack.json", "utf8"))[0].files.map((f) => f.path);
            const required = [
              "build/index.js",
              "build/index.d.ts",
              "app.plugin.js",
              "plugin/build/index.js",
              "expo-module.config.json",
              "ios/GattServerManager.swift",
              "android/src/main/java/expo/modules/gattserver/GattServerManager.kt",
            ];
            const missing = required.filter((f) => !files.includes(f));
            if (missing.length) throw new Error("missing from the tarball: " + missing.join(", "));
            // Tests, the host-side harnesses and raw TypeScript have no business in a consumers install.
            const forbidden = files.filter(
              (f) => f.startsWith("src/") || f.startsWith("tests/") || f === "Package.swift"
            );
            if (forbidden.length) throw new Error("should not ship: " + forbidden.join(", "));
            console.log(`tarball looks right (${files.length} files)`);
          '

  swift:
    name: Swift (iOS peripheral logic)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:ios

  android:
    name: Kotlin (Android peripheral logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The harness commits its own `gradle-wrapper.jar`, which the wrapper needs before it can verify
      # anything itself. This is the check that it is the jar Gradle actually published.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: npm run test:android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: tests/android/build/reports/tests/

  android-integration:
    name: Android module builds against Expo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform android --no-install
        working-directory: example
      # The unit-test harness deliberately leaves `ExpoGattServerModule.kt` out, because the Expo
      # Gradle plugin only resolves inside a host app's build. This is the job that compiles it — so a
      # binding that no longer matches the parsers or the manager fails here rather than in someone's
      # app.
      - run: ./gradlew :expo-gatt-server:compileReleaseKotlin --console=plain
        working-directory: example/android

  ios-integration:
    name: iOS module builds against Expo
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Expo's toolchain window is bounded at both ends, so neither the runner default nor the newest
      # installed Xcode works.
      #
      # Too old: the default is Xcode 16.4, whose Swift tools are 6.1, and one of the packages Expo's
      # prebuilt React Native artefacts resolve declares `swift-tools-version: 6.2` — SwiftPM refuses
      # the whole dependency graph and the build dies in `ExpoModulesJSI` before it reaches this
      # module's sources.
      #
      # Too new: Xcode 26.3 (Swift 6.2.4) fails to type-check `JavaScriptCodable+Date.swift` inside
      # that same package — `abs(milliseconds) <= maxJavaScriptDateMilliseconds` is reported as
      # ambiguous, though it compiles standalone. That is an upstream defect against a compiler Expo
      # 57.0.4 predates, and nothing in this repository can work around it.
      #
      # So the version is pinned rather than discovered. Selecting the newest was what let a runner
      # image update change the compiler under this job and turn it red on something this repository
      # does not own; a list keeps the toolchain the same on every run while still tolerating an
      # image that drops one entry. Revisit when Expo ships a release that builds under a newer one.
      - name: Select an Xcode within Expo's supported Swift range
        run: |
          for version in 26.2 26.1.1 26.0.1; do
            candidate="/Applications/Xcode_${version}.app"
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              echo "Selected $candidate"
              swift --version
              exit 0
            fi
          done
          echo "None of the known-good Xcode versions (26.2, 26.1.1, 26.0.1) is installed." >&2
          echo "Installed: $(ls -d /Applications/Xcode_*.app 2>/dev/null | tr '\n' ' ')" >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform ios --no-install
        working-directory: example
      - run: pod install
        working-directory: example/ios
      # The counterpart of `android-integration`, and for the same reason: `Package.swift` compiles
      # `GattServerManager.swift` alone, because `ExpoGattServerModule.swift` imports ExpoModulesCore and
      # has no host build — so until this job existed, a third of the iOS source was compiled by nothing
      # in CI and a binding that no longer matched the manager would have shipped. Only the module's own
      # pod target is built, not the whole app, which is all it takes to catch that.
      - name: Compile the ExpoGattServer pod target
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace "$(ls -d *.xcworkspace | head -1)" \
            -scheme ExpoGattServer \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            build CODE_SIGNING_ALLOWED=NO
