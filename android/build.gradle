plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Read from package.json, as the podspec already does, so one bump moves every artefact.
def packageVersion = new groovy.json.JsonSlurper()
  .parseText(file('../package.json').text)
  .version

group = 'expo.modules.gattserver'
version = packageVersion

android {
  namespace "expo.modules.gattserver"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 24)
    versionCode 1
    versionName packageVersion
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.toVersion(safeExtGet("jvmTarget", "17"))
    targetCompatibility JavaVersion.toVersion(safeExtGet("jvmTarget", "17"))
  }

  kotlinOptions {
    jvmTarget = safeExtGet("jvmTarget", "17")
  }
}

dependencies {
}
